name: Windows checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          architecture: x64
      - name: Test installer and repository boundaries
        run: python -m unittest discover -s tests -v
      - name: Build and verify source kit
        run: python scripts/build_release.py
      - uses: actions/upload-artifact@v7
        with:
          name: windows-source-kit
          path: dist/*.zip
          if-no-files-found: error
